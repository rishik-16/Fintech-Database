services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payledger_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payledger_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-payledger}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payledger_admin} -d ${POSTGRES_DB:-payledger}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payledger

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-payledger_admin}:${POSTGRES_PASSWORD:-payledger_secret_2024}@db:5432/${POSTGRES_DB:-payledger}}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-change-in-production-abc123def456}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      KYC_HMAC_SECRET: ${KYC_HMAC_SECRET:-dev-kyc-hmac-secret-change-in-production-789xyz}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - payledger

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - payledger

volumes:
  pgdata:

networks:
  payledger:
    driver: bridge
